name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4-otp-27"
            otp: "27.3.4.15"
          - elixir: "1.20.4-otp-29"
            otp: "29.1.2"
    defaults:
      run:
        working-directory: wotex-tracker
    env:
      MIX_ENV: test
      WOTEX_PATH_DEPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wotex-tracker
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wotex-project/wotex
          ref: ba8ea373244ce57987f47a731b8eca3ccae9b45f
          path: wotex
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix deps.get --check-locked
      - run: mix check --no-retry

  components:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: service
            directory: packages/tracker_service
            ui: false
            elixir: "1.18.4-otp-27"
            otp: "27.3.4.15"
          - profile: ui
            directory: packages/tracker_ui
            ui: false
            elixir: "1.18.4-otp-27"
            otp: "27.3.4.15"
          - profile: host
            directory: hosts/app
            ui: false
            elixir: "1.18.4-otp-27"
            otp: "27.3.4.15"
          - profile: host-ui
            directory: hosts/app
            ui: true
            elixir: "1.18.4-otp-27"
            otp: "27.3.4.15"
          - profile: nerves
            directory: hosts/nerves
            ui: false
            elixir: "1.18.4-otp-27"
            otp: "27.3.4.15"
          - profile: nerves-ui
            directory: hosts/nerves
            ui: true
            elixir: "1.18.4-otp-27"
            otp: "27.3.4.15"
          - profile: mobile
            directory: hosts/mobile
            ui: false
            elixir: "1.20.4-otp-29"
            otp: "29.1.2"
    defaults:
      run:
        working-directory: wotex-tracker/${{ matrix.directory }}
    env:
      MIX_ENV: test
      MIX_TARGET: host
      WOTEX_PATH_DEPS: "1"
      CI_PROFILE: ${{ matrix.profile }}
      CI_TRACKER_UI: ${{ matrix.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wotex-tracker
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wotex-project/wotex
          ref: ba8ea373244ce57987f47a731b8eca3ccae9b45f
          path: wotex
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Install Nerves bootstrap
        if: startsWith(matrix.profile, 'nerves')
        working-directory: wotex-tracker
        run: mix archive.install hex nerves_bootstrap 1.17.3 --force
      - name: Install native toolchain
        if: startsWith(matrix.profile, 'host') || matrix.profile == 'mobile'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Check locked dependencies
        run: |
          if [ "$CI_TRACKER_UI" = "true" ]; then export WOTEX_TRACKER_UI=1; fi
          mix deps.get --check-locked
      - name: Verify package or host
        run: |
          if [ "$CI_TRACKER_UI" = "true" ]; then export WOTEX_TRACKER_UI=1; fi
          case "$CI_PROFILE" in
            nerves|nerves-ui)
              mix format --check-formatted
              mix compile --warnings-as-errors
              mix test --no-start
              ;;
            *) mix check --no-retry ;;
          esac
